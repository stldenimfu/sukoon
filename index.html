<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sukoon</title>
<meta name="theme-color" content="#12222a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sukoon">
<style>
  :root {
    --navy: #1f2f4a; --navy-2: #2b4166; --amber: #e0a030;
    --bg: #e9edf2; --mine: #dbe7fb; --theirs: #ffffff; --ink: #1c2430; --muted: #6b7686; --line: #c9d1dc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; overflow: hidden; }
  /* The page itself never scrolls: the app always fills exactly the part of the screen above the keyboard */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 16px; }
  button, input, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* Sign-in */
  #login { height: var(--vvh, 100%); overflow-y: auto; transform: translateY(var(--vvt, 0px)); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(31,47,74,.12); }
  .card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .card input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  input:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  #who2 { display: flex; gap: 10px; }
  #who2 button { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; font-size: 17px; cursor: pointer; color: var(--ink); }
  #who2 button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .primary { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  .ver { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; }
  #loginErr { color: #b3261e; font-size: 14px; min-height: 20px; margin-top: 10px; overflow-wrap: anywhere; }

  /* Chat */
  #chat { height: 100%; height: var(--vvh, 100dvh); transform: translateY(var(--vvt, 0px)); display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 10px 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid var(--amber); }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--navy); font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-right: 4px; }
  header .grow { flex: 1; min-width: 0; }
  header .title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .who.typing { color: var(--amber); opacity: 1; font-weight: 600; }
  header .who.online { color: #8fd9b0; opacity: 1; font-weight: 600; }
  header .who { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hbtn svg { width: 21px; height: 21px; }
  #bellBtn.on svg { stroke: var(--amber); }
  #bellBtn.on #bellSlash { display: none; }
  #logoutBtn { flex: none; background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 9px; font-size: 13px; cursor: pointer; }

  #selbar { background: var(--navy-2); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid var(--amber); min-height: 63px; }
  #selbar b { flex: 1; font-size: 16px; }
  #selbar button { border: 1px solid rgba(255,255,255,.45); background: transparent; color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #selDelete { background: #b9544e !important; border-color: #b9544e !important; font-weight: 600; }
  #selDelete:disabled { opacity: .5; }
  .row.sel { background: var(--selrow); border-radius: 10px; }
  .selecting .rbtn { visibility: hidden; }
  #pinbar { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink); }
  #pinbar svg { flex: none; width: 16px; height: 16px; }
  #pinbar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pinbar em { flex: none; font-style: normal; color: var(--muted); }

  #list { flex: 1; overflow-y: auto; padding: 12px 10px 4px; -webkit-overflow-scrolling: touch; }
  .day { text-align: center; margin: 14px 0 10px; }
  .day span { background: #d5dbe4; color: #3c4756; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .row { display: flex; margin: 4px 0; touch-action: pan-y; }
  .row.mine { justify-content: flex-end; }
  .bubble { max-width: 78%; min-width: 0; background: var(--theirs); border-radius: 14px 14px 14px 4px; padding: 8px 11px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; }
  .mine .bubble { background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .pending .bubble { opacity: .65; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
  .text a { color: #1a5fd0; text-decoration: underline; }
  .gone .bubble { cursor: default; }
  .gone .text { font-style: italic; color: var(--muted); font-size: 14px; }
  .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .stat { margin-left: 6px; font-weight: 600; }
  .stat.seen { color: #1a73e8; }
  .pinmark { margin-right: 6px; }
  .pic { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin: 2px 0 4px; cursor: zoom-in; }
  .picwait { width: 180px; height: 120px; border-radius: 10px; background: rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin: 2px 0 4px; }
  .file { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; margin: 2px 0 4px; cursor: pointer; min-width: 180px; }
  .file svg { flex: none; width: 26px; height: 26px; }
  .file div { flex: 1; min-width: 0; }
  .file b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file small { display: block; font-size: 12px; color: var(--muted); }
  #docbar { display: flex; align-items: center; gap: 10px; margin: 6px 10px 0; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  #docbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #docbar button { flex: none; border: 0; background: var(--soft); color: var(--soft-ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .voice { display: block; width: 240px; max-width: 100%; height: 40px; margin: 2px 0 4px; }
  .rbtn { flex: none; align-self: center; border: 0; background: none; padding: 6px; cursor: pointer; opacity: .55; }
  .rbtn svg { width: 18px; height: 18px; display: block; }
  .quote { border-left: 3px solid var(--amber); background: rgba(0,0,0,.06); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; font-size: 13px; cursor: pointer; }
  .quote b { display: block; color: var(--navy-2); font-size: 12px; }
  .quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; color: #3c4756; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .reacts:empty { display: none; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 1px 7px; font-size: 14px; cursor: pointer; line-height: 1.5; }
  .chip.me { border-color: var(--amber); background: #fdf3df; }
  .chip small { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .flash .bubble { animation: flash 1.4s; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--amber); } 100% { box-shadow: 0 1px 2px rgba(0,0,0,.08); } }
  #older { display: block; margin: 4px auto 10px; border: 0; background: #d5dbe4; color: #3c4756; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  #empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }
  #status { text-align: center; font-size: 12px; color: #b3261e; min-height: 16px; padding: 0 12px; overflow-wrap: anywhere; }

  #replybar { display: flex; align-items: center; gap: 10px; margin: 6px 10px 0; padding: 6px 10px; background: #fff; border-left: 3px solid var(--amber); border-radius: 8px; font-size: 13px; }
  #replybar .grow { flex: 1; min-width: 0; }
  #replybar b { display: block; color: var(--navy-2); font-size: 12px; }
  #replybar span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3c4756; }
  #replybar button { flex: none; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 6px; }
  #preview { padding: 8px 12px 0; display: flex; align-items: center; gap: 10px; }
  #preview img { height: 64px; border-radius: 8px; }
  #preview button { border: 0; background: #d5dbe4; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #composer { display: flex; align-items: flex-end; gap: 5px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
  #composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 22px; padding: 11px 14px; max-height: 120px; line-height: 1.3; background: #fff; }
  .round { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #micBtn, #stkBtn, #attBtn, #camBtn { background: #fff; border: 1px solid var(--line); }
  .round { width: 42px; height: 42px; }
  .round svg { width: 21px; height: 21px; }
  #sendBtn { background: var(--navy); }
  .round svg { width: 22px; height: 22px; }
  #recbar { display: flex; align-items: center; gap: 10px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  #recbar .dot { width: 12px; height: 12px; border-radius: 50%; background: #d93025; animation: blink 1s infinite; }
  #recbar .lbl { flex: 1; font-weight: 600; }
  #recbar button { border: 0; border-radius: 22px; padding: 11px 16px; cursor: pointer; font-weight: 600; }
  #recCancel { background: #d5dbe4; color: var(--ink); }
  #recSend { background: var(--navy); color: #fff; }
  @keyframes blink { 50% { opacity: .25; } }

  /* Overlays */
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 30; cursor: zoom-out; }
  #viewer img { max-width: 100%; max-height: 100%; }
  .shade { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); background: rgba(15,23,36,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #sheet .box, #attach .box, #stk .box { width: 100%; max-width: 760px; background: #fff; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #emojis { display: flex; justify-content: space-between; margin-bottom: 10px; }
  #emojis button { border: 0; background: #f1f3f6; border-radius: 50%; width: 46px; height: 46px; font-size: 24px; cursor: pointer; }
  #emojis button.on { background: #fdf3df; box-shadow: inset 0 0 0 2px var(--amber); }
  .act { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 6px; font-size: 16px; cursor: pointer; border-top: 1px solid #edf0f4; color: var(--ink); }
  #panel { align-items: stretch; }
  #panel .box { width: 100%; max-width: 760px; background: var(--bg); display: flex; flex-direction: column; }
  #panel .top { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 10px 10px 16px; border-bottom: 3px solid var(--amber); }
  #panel .top b { flex: 1; font-size: 17px; }
  #panel .top button { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #searchForm { display: flex; gap: 8px; padding: 10px; }
  #searchForm input { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 22px; }
  #searchForm button { border: 0; background: var(--navy); color: #fff; border-radius: 22px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #panelList { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .item { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 10px 12px; margin: 6px 0; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .item .grow { flex: 1; min-width: 0; }
  .item small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .item button { flex: none; border: 0; background: #edf0f4; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; padding: 0 20px; }
  /* Hold a message to open its menu, so text is not selected by the press */
  .bubble { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .bubble img { -webkit-touch-callout: none; -webkit-user-drag: none; }
  .edited { margin-right: 6px; font-style: italic; }
  .stat { letter-spacing: -2px; margin-left: 5px; }
  .stat.seen { color: #53bdeb !important; }
  #pinsBtn { position: relative; }
  #pinBadge { position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--amber); color: var(--onaccent); font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  #list { background-image: var(--tex, none); background-size: 180px 180px; }
  /* Location */
  .loc { display: block; width: 240px; max-width: 100%; margin: 2px 0 4px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.08); color: inherit; text-decoration: none; }
  .loc iframe { display: block; width: 100%; height: 150px; border: 0; pointer-events: none; }
  .loc div { padding: 7px 10px 8px; }
  .loc b { display: block; font-size: 14px; }
  .loc small { display: block; font-size: 12px; color: var(--muted); }
  /* Camera */
  #cam { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); background: #000; z-index: 40; display: flex; align-items: center; justify-content: center; }
  #camVideo { width: 100%; height: 100%; object-fit: cover; }
  #camVideo.front { transform: scaleX(-1); }
  #camClose { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; }
  #camBar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px calc(22px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  #camGallery, #camFlip { width: 72px; border: 0; background: none; color: #fff; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #camGallery svg, #camFlip svg { width: 30px; height: 30px; }
  #camShot { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); cursor: pointer; }
  #camShot:active { background: rgba(255,255,255,.7); }
  #themes button { font-size: 11px; }

  /* Profiles */
  .avatar { background-size: cover; background-position: center; cursor: pointer; }
  header .grow { cursor: pointer; }
  #prof { align-items: stretch; }
  #prof .box { width: 100%; max-width: 760px; background: var(--bg); display: flex; flex-direction: column; }
  #prof .top { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 10px 10px 16px; border-bottom: 3px solid var(--amber); }
  #prof .top b { flex: 1; font-size: 17px; }
  #prof .top button { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #profBody { flex: 1; overflow-y: auto; padding: 14px 12px 24px; }
  .pcard { background: var(--surface); border-radius: 16px; padding: 20px 16px; margin-bottom: 14px; text-align: center; }
  .plabel { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .pav { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 10px; background: var(--amber) center / cover no-repeat; color: var(--navy); font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pav.has { cursor: zoom-in; }
  .pname { font-size: 20px; font-weight: 700; }
  .pabout { margin-top: 6px; color: var(--soft-ink); overflow-wrap: anywhere; }
  .pabout.none { color: var(--muted); font-style: italic; }
  .pseen { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .prow { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; }
  .prow button { border: 0; background: var(--soft); color: var(--soft-ink); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 14px; }
  .pcard label { display: block; text-align: left; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .pcard input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .pcard .primary { margin-top: 12px; }
  #themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #themes button { border: 2px solid transparent; border-radius: 12px; padding: 8px 6px; cursor: pointer; background: var(--soft); color: var(--soft-ink); font-size: 12px; }
  #themes button.on { border-color: var(--amber); color: var(--ink); }
  #themes i { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
  #themes i span { flex: 1; }
  #profMsg { min-height: 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }

  /* Stickers */
  .row.stk .bubble { background: transparent; box-shadow: none; padding: 2px 4px; }
  .stkimg { display: block; width: 140px; height: 140px; object-fit: contain; cursor: pointer; }
  .text.big { font-size: 44px; line-height: 1.15; }
  #attach .act:first-child { border-top: 0; }
  #stk .box { max-height: 72vh; overflow-y: auto; }
  #stkTop { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #stkTop span { flex: 1; }
  #stkTop .tab { background: transparent !important; color: var(--muted) !important; font-size: 15px; font-weight: 700; padding: 7px 8px; border-bottom: 2px solid transparent; border-radius: 0; }
  #stkTop .tab.on { color: var(--ink) !important; border-bottom-color: var(--amber); }
  #stkTop button { border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  #stkEdit.on { background: #b9544e !important; color: #fff !important; }
  #stkGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #stkGrid button { position: relative; aspect-ratio: 1; border: 0; border-radius: 12px; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; overflow: hidden; }
  #stkGrid img { width: 100%; height: 100%; object-fit: contain; }
  #stkGrid .add { font-size: 30px; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
  #stkGrid.editing button:not(.add)::after { content: '\00D7'; position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: #b9544e; color: #fff; font-size: 15px; }
  #stkNote { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 4px 2px; }
  #stkHead { margin: 14px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #emoGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  #emoGrid button { border: 0; background: none; font-size: 30px; padding: 6px 0; cursor: pointer; border-radius: 10px; }

  /* GIF search */
  #gifForm { display: flex; gap: 8px; margin-bottom: 10px; }
  #gifForm input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 22px; }
  #gifForm button { border: 0; border-radius: 22px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #gifGrid { column-count: 2; column-gap: 8px; min-height: 120px; }
  #gifGrid button { display: block; width: 100%; margin: 0 0 8px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--soft); break-inside: avoid; }
  #gifGrid img { display: block; width: 100%; height: auto; }
  #gifGrid .note { margin: 20px 0; column-span: all; }

<body>

<div id="login" class="hidden">
  <form class="card" id="loginForm">
    <h1>Sukoon</h1>

</div>

<div id="chat" class="hidden">

    </button>
    <button id="logoutBtn" type="button">Sign out</button>

  function makeFile(f) {
    var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var note = sizeLabel(f.size) + ' \u00B7 tap to download';
    var card = fileCard(f.name, note), busyDl = false, ready = null;
    var sm = card.querySelector('small');

    function saveByLink() {
      var url = URL.createObjectURL(ready);
      var a = document.createElement('a'); a.href = url; a.download = f.name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }
    // On phones, hand the file to the phone's own "open / save" sheet when it can take it
    function deliver() {
      var canShare = false;
      try { canShare = touch && navigator.canShare && navigator.canShare({ files: [ready] }); } catch (e) {}
      if (!canShare) { saveByLink(); return; }
      navigator.share({ files: [ready], title: f.name }).catch(function (err) {
        if (!err || err.name !== 'AbortError') saveByLink();
      });
    }

    card.addEventListener('click', function () {
      if (selecting || busyDl) return;
      if (ready) { deliver(); return; }
      busyDl = true; sm.textContent = 'Downloading…';
      api('getPicture', { pass: pass, id: f.id }).then(function (src) {
        // Turn the received text back into the real file
        var at = src.indexOf('base64,');
        var type = src.slice(5, src.indexOf(';')) || 'application/octet-stream';
        var bin = atob(src.slice(at + 7)), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        ready = new File([bytes], f.name, { type: type });
        busyDl = false;
        if (touch) {
          // Phones only allow saving straight after a tap, so ask for one more
          sm.textContent = sizeLabel(f.size) + ' \u00B7 ready, tap to open or save';
        } else {
          sm.textContent = sizeLabel(f.size) + ' \u00B7 tap to save again';
          deliver();
        }
      }).catch(function (err) {
        busyDl = false; sm.textContent = note;
        setStatus('Could not download: ' + errText(err));
      });
    });
    return card;
  }

  // ---------- Firebase: live messages, seen, typing and online ----------
  // Every message has a number as its id. New ones use the time they were sent, so they
  // sort in order; messages copied from the old sheet keep their row number.
  function K(id) { var s = String(Math.floor(id)); while (s.length < 14) s = '0' + s; return 'm' + s; }
  function idOf(key) { return Number(String(key).slice(1)); }
  function nowMs() { return Date.now() + srvOffset; }
  function newId() {

    var id = Math.floor(nowMs()) * 10 + idx;
    var floor = Math.max(lastOwnId, lastRow);
    if (id <= floor) id = (Math.floor(floor / 10) + 1) * 10 + idx;
    lastOwnId = id;
    return id;

  function toMsg(key, v) {
    v = v || {};
    var id = idOf(key), t = typeof v.t === 'number' ? v.t : nowMs();
    if (v.del) return { id: id, t: t, name: v.name || '', del: true, by: v.by || '' };
    var m = { id: id, t: t, name: v.name || '', text: v.text || '', pic: v.pic || '', voice: v.voice || '' };
    if (v.stk) m.stk = true;
    if (v.gif) m.gif = v.gif;
    if (v.file) m.file = v.file;
    if (v.reply) m.reply = v.reply;
    if (v.rx) m.rx = v.rx;
    if (v.ed) m.ed = v.ed;
    if (v.loc && typeof v.loc.lat === 'number' && typeof v.loc.lng === 'number') m.loc = v.loc;
    return m;
  }

  // What is stored in Firebase for a message (everything except its id)
  function nodeOf(m, t) {
    var n = { t: t, name: m.name };
    if (m.del) { n.del = true; n.by = m.by || ''; return n; }
    if (m.text) n.text = String(m.text).slice(0, 4000);
    if (m.pic) n.pic = m.pic;
    if (m.stk) n.stk = true;
    if (m.gif) n.gif = m.gif;
    if (m.voice) n.voice = m.voice;
    if (m.file && m.file.id) n.file = { id: m.file.id, name: String(m.file.name || 'document'), size: Number(m.file.size) || 0 };
    if (m.reply && m.reply.id) n.reply = { id: Number(m.reply.id), name: String(m.reply.name || ''), text: String(m.reply.text || '').slice(0, 140) };
    if (m.rx) n.rx = m.rx;
    if (m.ed) n.ed = m.ed;
    if (m.loc) n.loc = { lat: Number(m.loc.lat), lng: Number(m.loc.lng), acc: Number(m.loc.acc) || 0 };
    return n;
  }

  // Writes a finished message to Firebase. It appears at once; "Sending…" shows until Firebase confirms.
  function fbSend(m) {
    var id = newId();
    m.name = me;
    unsent[id] = true;
    stopTyping();
    return fb.ref('msgs/' + K(id)).set(nodeOf(m, TS)).then(function () {
      delete unsent[id]; paintStatus();
    }).catch(function (err) {
      delete unsent[id]; paintStatus();
      setStatus('Not sent: ' + errText(err) + '. Please sign out, sign in again and resend.');
    });

  var liveRef = null, addBuf = [], addTimer = null, firstFlush = false, cacheTimer = null;

  function saveCacheSoon() {
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(saveCache, 400);
  }

  // Listens to every loaded message and anything newer: new messages, reactions and deletions
  function attachLive() {
    if (liveRef) liveRef.off();
    liveRef = fb.ref('msgs').orderByKey().startAt(K(firstRow || 0));
    liveRef.on('child_added', onLive);
    liveRef.on('child_changed', onLive);
  }

  function onLive(snap) {
    var m = toMsg(snap.key, snap.val());
    if (!(m.id > 0)) return;
    var old = byId[m.id];
    if (old) { syncMsg(old, m); return; }
    addBuf.push(m);
    if (!addTimer) addTimer = setTimeout(flushAdds, 0);
  }

  function flushAdds() {
    addTimer = null;
    var buf = addBuf; addBuf = [];
    // The same message can be announced twice (once locally, once confirmed): keep the newest copy
    var latest = {};
    buf.forEach(function (m) { latest[m.id] = m; });
    var list = Object.keys(latest).map(function (k) { return latest[k]; }).filter(function (m) { return !byId[m.id]; });
    list.sort(function (a, b) { return a.id - b.id; });
    var fresh = list.filter(function (m) { return m.id > lastRow; });
    var late = list.filter(function (m) { return !(m.id > lastRow); });
    var force = firstFlush; firstFlush = false;
    if (fresh.length) addMessages({ items: fresh }, force);
    late.forEach(insertLate);
    updateMyState();
  }

  // A message that belongs before ones already shown (two people sending at the same instant)
  function insertLate(m) {
    if (byId[m.id]) return;
    items.push(m); items.sort(function (a, b) { return a.id - b.id; });
    var row = buildRow(m), list = $('list'), rows = list.querySelectorAll('.row[data-row]'), before = null;
    for (var i = 0; i < rows.length; i++) {
      if (Number(rows[i].getAttribute('data-row')) > m.id) { before = rows[i]; break; }
    }
    var empty = $('empty'); if (empty) empty.remove();
    if (before) list.insertBefore(row, before); else list.appendChild(row);
    if (!firstRow || m.id < firstRow) firstRow = m.id;
    paintStatus(); paintPins(); saveCacheSoon();
  }

  // Brings a shown message up to date with what Firebase now holds
  function syncMsg(old, m) {
    if (m.del) { if (!old.del) { markDeleted(m.id, m.by); saveCacheSoon(); } return; }
    if (old.del) return;
    if (old.text !== m.text || (old.ed || 0) !== (m.ed || 0)) {
      // The message was edited: show the new text in place
      for (var i = 0; i < items.length; i++) { if (items[i].id === m.id) items[i] = m; }
      var row = rowOf(m.id), wasSel = row && row.classList.contains('sel');
      if (row) { var nr = buildRow(m); if (wasSel) nr.classList.add('sel'); row.parentNode.replaceChild(nr, row); } else byId[m.id] = m;
      searchAll = null;
      paintStatus(); paintPins(); saveCacheSoon();
      return;
    }

  }

  // Tells the other person how far I have received and seen
  var myD = 0, myS = 0;
  function updateMyState() {
    if (!fb || !me || !lastRow) return;
    // Besides the position, the time is logged, so "Info" can show when a message was delivered and seen
    var u = {}, any = false;

    if (!document.hidden && lastRow > myS) { u['state/' + me + '/s'] = lastRow; u['log/' + me + '/s/' + K(lastRow)] = TS; myS = lastRow; any = true; }
    if (any) fb.ref().update(u).catch(function () {});

  function setOnline() {

  // Typing: a time stamp that is renewed while I type and removed when I stop

  function onPins(snap) {

  // Starts everything once Firebase has confirmed who is signed in
  function boot() {
    fb.ref('.info/serverTimeOffset').on('value', function (s) { srvOffset = Number(s.val()) || 0; });
    fb.ref('.info/connected').on('value', function (s) {

      if ($('status').getAttribute('data-net')) setStatus('');

  // One time only: copies the messages from the old Google Sheet into Firebase

  // Swipe a message to the right to reply to it
  (function () {
    var list = $('list');
    list.addEventListener('touchstart', function (ev) {
      swipe = null;

    }
    list.addEventListener('touchend', end);
    list.addEventListener('touchcancel', end);
  })();

  // The send button takes the place of the camera and microphone once there is something to send
  function updateComposer() {
    var has = !!(msgIn.value.trim() || pendingPic || pendingFile);
    $('sendBtn').classList.toggle('hidden', !has);
    $('camBtn').classList.toggle('hidden', has);
    $('micBtn').classList.toggle('hidden', has);
  }

  // Press and hold a message to open its menu (reactions, reply, edit, pin, copy, delete)
  (function () {
    var list = $('list'), timer = null, sx = 0, sy = 0;
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    list.addEventListener('pointerdown', function (ev) {
      cancel();
      if (selecting || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
      var row = ev.target.closest('.row[data-row]');
      if (!row || row.classList.contains('gone') || !ev.target.closest('.bubble') || ev.target.closest('audio, .rbtn')) return;
      var m = byId[Number(row.getAttribute('data-row'))];
      if (!m) return;
      sx = ev.clientX; sy = ev.clientY;
      timer = setTimeout(function () {
        timer = null;
        if (selecting || !$('sheet').classList.contains('hidden')) return;
        heldAt = Date.now();
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
        openSheet(m);
      }, 480);
    });
    list.addEventListener('pointermove', function (ev) { if (timer && (Math.abs(ev.clientX - sx) > 10 || Math.abs(ev.clientY - sy) > 10)) cancel(); });
    ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(function (n) { list.addEventListener(n, cancel); });
    // Letting go after a hold must not also count as a tap on the picture, link or file underneath
    list.addEventListener('click', function (ev) {
      if (Date.now() - heldAt < 700) { ev.stopPropagation(); ev.preventDefault(); }
    }, true);
  })();

  // ---------- In-app camera ----------
  function stopCam() {
    if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
    $('camVideo').srcObject = null;
  }
  function closeCam() { stopCam(); $('cam').classList.add('hidden'); }

  function startCam() {
    stopCam();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (stream) {
      camStream = stream;
      var v = $('camVideo');
      v.srcObject = stream;
      v.className = camFacing === 'user' ? 'front' : '';
      return v.play().catch(function () {});
    });
  }

  function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('capIn').click(); return; }
    $('cam').classList.remove('hidden');
    startCam().catch(function () {
      closeCam();
      setStatus('The camera could not be opened. Allow the camera for this app, or choose a photo with +.');
    });
  }

  $('camClose').addEventListener('click', closeCam);
  $('camGallery').addEventListener('click', function () { closeCam(); $('fileIn').click(); });
  $('camFlip').addEventListener('click', function () {
    camFacing = camFacing === 'user' ? 'environment' : 'user';
    startCam().catch(function () { camFacing = camFacing === 'user' ? 'environment' : 'user'; startCam().catch(closeCam); });
  });
  $('camShot').addEventListener('click', function () {
    var v = $('camVideo');
    if (!v.videoWidth) return;
    var c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(function (blob) {
      closeCam();
      if (blob) usePicture(blob); else setStatus('The photo could not be taken. Please try again.');
    }, 'image/jpeg', 0.92);
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) closeCam(); });

  // ---------- Sharing my location ----------
  $('locBtn').addEventListener('click', function () {
    closeAttach();
    if (!navigator.geolocation) { setStatus('This phone or browser cannot share a location.'); return; }
    setStatus('Finding your location…');
    var reply = replyTo;
    navigator.geolocation.getCurrentPosition(function (pos) {
      setStatus('');
      var c = pos.coords;
      post({ text: '', reply: reply, loc: { lat: Math.round(c.latitude * 1e6) / 1e6, lng: Math.round(c.longitude * 1e6) / 1e6, acc: Math.round(c.accuracy || 0) } });
      if (replyTo === reply) setReply(null);
    }, function (err) {
      setStatus(err && err.code === 1 ? 'Location is not allowed. Allow location for this app in the phone settings and try again.' :
        err && err.code === 3 ? 'Finding your location took too long. Please try again, outdoors if possible.' :
        'Your location could not be found. Check that location is switched on.');
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  });

  // ---------- Sending ----------
  var msgIn = $('msgIn');
  msgIn.addEventListener('input', function () {
    msgIn.style.height = 'auto';
    msgIn.style.height = Math.min(msgIn.scrollHeight, 120) + 'px';
    updateComposer();
    touchTyping();
  });
  msgIn.addEventListener('keydown', function (ev) {
    // On a computer, Enter sends and Shift+Enter makes a new line
    if (ev.key === 'Enter' && !ev.shiftKey && !('ontouchstart' in window)) { ev.preventDefault(); send(); }
  });
  $('sendBtn').addEventListener('click', send);
  // On a phone, sending must not close the keyboard: handle the tap ourselves so the box keeps focus
  $('sendBtn').addEventListener('touchend', function (ev) { ev.preventDefault(); send(); msgIn.focus(); });

  // Keeps the app sized to the visible screen, so the message box sits right on top of the keyboard
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    function fit() {
      var list = $('list');
      var near = list.scrollHeight - list.scrollTop - list.clientHeight < 160;
      var st = document.documentElement.style;
      st.setProperty('--vvh', Math.round(vv.height) + 'px');
      st.setProperty('--vvt', Math.round(vv.offsetTop) + 'px');
      if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
      if (near) scrollDown();
    }
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    msgIn.addEventListener('focus', function () { setTimeout(fit, 50); setTimeout(fit, 350); });
    fit();
  })();

  // Text, stickers and GIFs go straight to Firebase. Pictures, voice messages and documents
  // are first saved to Google Drive (shown as "Sending…"), then the message is written.
  function send() {
    var text = msgIn.value.trim();
    if (editing) {
      var ed = editing, cur = byId[ed.id];
      if (!text) return;
      editing = null; $('replybar').classList.add('hidden');
      msgIn.value = ''; msgIn.style.height = 'auto'; updateComposer(); stopTyping();
      if (!cur || cur.del || text === ed.old) return;
      var up = {};
      up['msgs/' + K(ed.id) + '/text'] = text.slice(0, 4000);
      up['msgs/' + K(ed.id) + '/ed'] = TS;
      if (isPinned(ed.id)) up['pins/' + K(ed.id) + '/text'] = text.slice(0, 80);
      fb.ref().update(up).catch(function (err) { setStatus('The change was not saved: ' + errText(err)); });
      return;
    }
    if (!text && !pendingPic && !pendingFile) return;
    typedAt = 0;
    post({ text: text, pic: pendingPic, voice: '', reply: replyTo, doc: pendingFile });
    clearDoc();
    setReply(null);
    msgIn.value = ''; msgIn.style.height = 'auto';
    clearPic();
    updateComposer();
  }

  function post(job) {
    if (!fb || !me) return;
    if (job.voice || job.doc || job.pic) { queueJob(job); return; }
    var m = { text: job.text || '', reply: job.reply || null };
    if (job.loc) m.loc = job.loc;
    if (job.sticker) { m.pic = job.sticker; m.stk = true; }
    if (job.gif) m.gif = job.gif;
    fbSend(m);
    scrollSoon();
  }

  function scrollSoon() { setTimeout(scrollDown, 30); }

  function queueJob(job) {
    var row = document.createElement('div'); row.className = 'row mine pending';
    var b = document.createElement('div'); b.className = 'bubble';
    if (job.reply) b.appendChild(makeQuote(job.reply));
    if (job.pic) { var im = document.createElement('img'); im.className = 'pic'; im.alt = 'Picture being sent'; im.src = job.pic; b.appendChild(im); }
    if (job.doc) b.appendChild(fileCard(job.doc.name, sizeLabel(job.doc.size)));
    if (job.voice) { var v = document.createElement('div'); v.className = 'text'; v.textContent = 'Voice message'; b.appendChild(v); }
    if (job.text) { var tx = document.createElement('div'); tx.className = 'text'; fillText(tx, job.text); b.appendChild(tx); }
    var tm = document.createElement('div'); tm.className = 'time'; tm.textContent = 'Sending…';
    b.appendChild(tm); row.appendChild(b);
    var empty = $('empty'); if (empty) empty.remove();
    $('list').appendChild(row);
    scrollDown();
    job.el = row;
    queue.push(job);
    setStatus('');
    pump();
  }

  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    var job = queue[0];
    // A document is read from the phone just before it is sent
    var ready = !job.doc ? Promise.resolve(null) : new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res({ name: job.doc.name, type: job.doc.type || '', data: String(fr.result) }); };
      fr.onerror = function () { rej(new Error('the document could not be read from this phone')); };
      fr.readAsDataURL(job.doc);
    });
    ready.then(function (file) {
      return api('upload', { pass: pass, name: me, pic: job.pic || '', voice: job.voice || '', file: file });
    }).then(function (res) {
      sending = false; queue.shift();
      res = res || {};
      // Keep my own copy so the picture or voice message shows without downloading it again
      if (res.pic && job.pic) { picCache[res.pic] = job.pic; picSave(res.pic, job.pic); }
      if (res.voice && job.voice) { picCache[res.voice] = job.voice; picSave(res.voice, job.voice); }
      if (job.el.parentNode) job.el.parentNode.removeChild(job.el);
      fbSend({ text: job.text || '', reply: job.reply || null, pic: res.pic || '', voice: res.voice || '', file: res.file || null });
      scrollSoon();
      pump();
    }).catch(function (err) {
      sending = false;
      // Give up on everything waiting, and put the typed text back so nothing is lost
      var lost = queue; queue = [];
      lost.forEach(function (j) { if (j.el.parentNode) j.el.parentNode.removeChild(j.el); });
      if (isWrongPass(err)) { signOut('Please sign in again.'); return; }
      var texts = lost.map(function (j) { return j.text; }).filter(Boolean).join('\n');
      if (texts && !msgIn.value) { msgIn.value = texts; updateComposer(); }
      setStatus('Not sent: ' + errText(err) + '. Please send again.');
    });
  }

  // ---------- Voice messages ----------
  var rec = null, recStream = null, recChunks = [], recTimer = null, recStart = 0, recSendIt = false, REC_MAX = 3600; // a safety stop after one hour

  function recMime() {
    var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    for (var i = 0; i < types.length; i++) {
      try { if (MediaRecorder.isTypeSupported(types[i])) return types[i]; } catch (e) {}
    }
    return '';
  }

  $('micBtn').addEventListener('click', function () {
    if (rec) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      setStatus('This phone or browser cannot record voice messages.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream; recChunks = []; recSendIt = false;
      var mime = recMime();
      var opts = { audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      try { rec = new MediaRecorder(stream, opts); } catch (e) { rec = new MediaRecorder(stream); }
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
      rec.onstop = recDone;
      rec.start(1000);
      recStart = Date.now();
      setStatus('');
      $('composer').classList.add('hidden');
      $('recbar').classList.remove('hidden');
      $('recTime').textContent = 'Recording 0:00';
      recTimer = setInterval(function () {
        var s = Math.floor((Date.now() - recStart) / 1000);
        $('recTime').textContent = 'Recording ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
        if (s >= REC_MAX) recStop(true);
      }, 500);
    }).catch(function () {
      setStatus('Microphone not allowed. Allow the microphone for this app and try again.');
    });
  });
  $('recCancel').addEventListener('click', function () { recStop(false); });
  $('recSend').addEventListener('click', function () { recStop(true); });

  function recStop(sendIt) {
    if (!rec) return;
    recSendIt = sendIt;
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    try { rec.stop(); } catch (e) { recDone(); }
  }

  function recDone() {
    var type = ((rec && rec.mimeType) || 'audio/webm').split(';')[0];
    var chunks = recChunks, sendIt = recSendIt;
    if (recStream) recStream.getTracks().forEach(function (t) { t.stop(); });
    rec = null; recStream = null; recChunks = [];
    $('recbar').classList.add('hidden');
    $('composer').classList.remove('hidden');
    if (!sendIt || !chunks.length) return;
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split('base64,')[1] || '';
      if (!b64) { setStatus('The recording was empty. Please try again.'); return; }
      post({ text: '', pic: '', voice: 'data:' + type + ';base64,' + b64, reply: replyTo });
      setReply(null);
    };
    fr.readAsDataURL(new Blob(chunks, { type: type }));
  }

  // ---------- Choosing a document ----------
  $('docBtn').addEventListener('click', function () { $('docIn').click(); });
  $('removeDoc').addEventListener('click', clearDoc);

  function clearDoc() {
    pendingFile = null; $('docIn').value = '';
    $('docbar').classList.add('hidden');
    updateComposer();
  }

  $('docIn').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.size > MAX_FILE) { clearDoc(); setStatus('That document is ' + sizeLabel(f.size) + '. The limit is ' + MAX_FILE_MB + ' MB.'); return; }
    if (!f.size) { clearDoc(); setStatus('That document is empty.'); return; }
    pendingFile = f;
    $('docName').textContent = f.name + ' (' + sizeLabel(f.size) + ')';
    $('docbar').classList.remove('hidden');
    setStatus('');
    updateComposer();
  });

  // ---------- Choosing a picture ----------
  $('picBtn').addEventListener('click', function () { $('fileIn').click(); });
  $('removePic').addEventListener('click', clearPic);

  function clearPic() {
    pendingPic = ''; $('fileIn').value = ''; $('capIn').value = '';
    $('preview').classList.add('hidden'); $('previewImg').removeAttribute('src');
    updateComposer();
  }

  $('fileIn').addEventListener('change', function () {
    var fs = this.files || [];
    if (fs.length > 1) { var all = Array.prototype.slice.call(fs); this.value = ''; sendPictures(all); return; }
    var f = fs[0];
    if (f) usePicture(f);
  });

  // Pasting a copied picture or screenshot into the message box attaches it
  msgIn.addEventListener('paste', function (ev) {
    var cd = ev.clipboardData;
    if (!cd) return;
    var f = null, i;
    for (i = 0; cd.files && i < cd.files.length; i++) { if (/^image\//.test(cd.files[i].type)) { f = cd.files[i]; break; } }
    for (i = 0; !f && cd.items && i < cd.items.length; i++) {
      if (cd.items[i].kind === 'file' && /^image\//.test(cd.items[i].type)) f = cd.items[i].getAsFile();
    }
    if (!f) return; // ordinary text: paste as usual
    ev.preventDefault();
    usePicture(f);
  });

  // Gets a picture ready to send: photos are shrunk, animated GIFs are kept as they are
  function prepPicture(f) {
    return new Promise(function (res, rej) {
      if (f.type === 'image/gif') {
        if (f.size > 4 * 1024 * 1024) { rej(new Error('That GIF is ' + sizeLabel(f.size) + '. The limit is 4 MB.')); return; }
        var fr = new FileReader();
        fr.onload = function () { res(String(fr.result)); };
        fr.onerror = function () { rej(new Error('That picture could not be opened. Try another one.')); };
        fr.readAsDataURL(f);
        return;
      }
      var url = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function () {
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * scale); c.height = Math.round(h * scale);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('That picture could not be opened. Try another one.')); };
      img.src = url;
    });
  }

  // One picture: shown above the message box so a caption can be added before sending
  function usePicture(f) {
    prepPicture(f).then(function (data) {
      pendingPic = data;
      $('previewImg').src = pendingPic;
      $('preview').classList.remove('hidden');
      setStatus('');
      updateComposer();
    }).catch(function (err) { setStatus(errText(err)); });
  }

  // Several pictures chosen together are sent straight away, one message each, in the order chosen
  function sendPictures(files) {
    var list = Array.prototype.slice.call(files, 0, 20), skipped = files.length - list.length, failed = 0;
    var reply = replyTo; setReply(null);
    var chain = Promise.resolve();
    list.forEach(function (f, i) {
      chain = chain.then(function () {
        return prepPicture(f).then(function (data) {
          post({ text: '', pic: data, voice: '', reply: i === 0 ? reply : null });
        }).catch(function () { failed++; });
      });
    });
    chain.then(function () {
      if (failed) setStatus(failed + (failed === 1 ? ' picture' : ' pictures') + ' could not be opened and ' + (failed === 1 ? 'was' : 'were') + ' skipped.');
      else if (skipped > 0) setStatus('Only the first 20 pictures were sent.');
    });
  }

  // ---------- Start ----------
  (function () {
    var vs = document.querySelectorAll('.ver');
    for (var vi = 0; vi < vs.length; vi++) vs[vi].textContent = 'Sukoon \u00B7 ' + APP_VERSION;
    notifyOn = false; // notifications are switched off in this version
    // config.js may hold the block exactly as copied from Firebase (const firebaseConfig = {...})
    var cfg = window.FIREBASE_CONFIG || (typeof firebaseConfig !== 'undefined' ? firebaseConfig : null);
    if (!window.firebase) { showLogin('The app could not load. Check your internet and reopen it.'); return; }
    if (!cfg || !cfg.databaseURL) { showLogin('Firebase is not set up yet. Paste the firebaseConfig block into config.js.'); return; }
    try {
      firebase.initializeApp(cfg);
      auth = firebase.auth(); fb = firebase.database();
      TS = firebase.database.ServerValue.TIMESTAMP;
    } catch (e) { showLogin('The app could not start: ' + errText(e)); return; }
    // Open straight into the saved chat; Firebase then confirms the sign-in and goes live
    var n = known(load('chatName'));
    if (n && load('chatPass')) enter(n);
    auth.onAuthStateChanged(onAuth);
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
